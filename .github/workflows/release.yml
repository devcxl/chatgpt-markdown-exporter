name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          node -e "
            const fs = require('node:fs');

            const manifestPath = 'manifest.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = '$VERSION';
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            console.log('manifest.json version updated to', '$VERSION');

            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            console.log('package.json version updated to', '$VERSION');
          "

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm package:all

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chatgpt-md-exporter-extension-*-chrome.zip
            chatgpt-md-exporter-extension-*-firefox.zip
          generate_release_notes: true
