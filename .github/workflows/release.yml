name: Release

# Draft-first 发布流程：
#   1. 推送 v* 标签 → 构建并创建「草稿」release，此时不会提交到任何商店，仓库维护者可以先复核产物
#   2. 在 GitHub 上发布该草稿 → 触发 submit 任务，正式提交 Chrome Web Store 与 AMO
#
# 之所以拆成两阶段：草稿 release 本身不会触发 release 事件，
# 因此「发布草稿」这一动作天然成为提交商店前的最后一道人工闸门。

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify version matches tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # 发布流程要求先改 package.json 再打标签；此处兜底校验，
          # 避免标签与包版本不一致导致产物文件名与商店版本号错位。
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = '$VERSION';
            if (pkg.version !== tag) {
              console.error('版本不一致：package.json=' + pkg.version + '，标签=' + tag);
              process.exit(1);
            }
            console.log('版本校验通过：' + tag);
          "

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build:all

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            .output/chatgpt-markdown-exporter-*-chrome.zip
            .output/chatgpt-markdown-exporter-*-firefox.zip
          generate_release_notes: true

  submit:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Read version from release tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: pnpm install

      - run: pnpm build:all

      - name: Check Chrome Web Store secrets
        id: chrome-secrets
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit to Chrome Web Store
        if: ${{ steps.chrome-secrets.outputs.available == 'true' }}
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          npx publish-extension \
            --chrome-zip ".output/chatgpt-markdown-exporter-${VERSION}-chrome.zip" \
            --chrome-api-version v2 \
            --chrome-publish-type STAGED_PUBLISH

      - name: Check AMO secrets
        id: amo-secrets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare AMO metadata
        if: ${{ steps.amo-secrets.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用本次 GitHub Release 的说明作为 AMO 的版本更新说明，
          # 避免在仓库里重复维护一份 release notes。
          gh release view "v${VERSION}" --json body -q .body > /tmp/release-notes.md
          node scripts/prepare-amo-metadata.mjs /tmp/amo-metadata.json /tmp/release-notes.md

      - name: Submit to Firefox Add-ons (AMO)
        if: ${{ steps.amo-secrets.outputs.available == 'true' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir .output/firefox-mv2 \
            --channel=listed \
            --amo-metadata /tmp/amo-metadata.json \
            --upload-source-code .output/chatgpt-markdown-exporter-*-sources.zip \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
