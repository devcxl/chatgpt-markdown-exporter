---
name: Release

"on":
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          node -e "
            const fs = require('node:fs');

            const manifestPath = 'manifest.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = '$VERSION';
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            console.log('manifest.json version updated to', '$VERSION');

            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            console.log('package.json version updated to', '$VERSION');
          "

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm package:all

      - name: Check AMO secrets
        id: amo-secrets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Firefox extension for AMO
        if: ${{ steps.amo-secrets.outputs.available == 'true' }}
        run: |
          FIREFOX_ZIP=$(ls chatgpt-markdown-exporter-*-firefox.zip)
          mkdir -p firefox-ext
          unzip -q "$FIREFOX_ZIP" -d firefox-ext

      - name: Prepare source archive for AMO
        if: ${{ steps.amo-secrets.outputs.available == 'true' }}
        run: |
          mkdir -p web-ext-source
          zip -r web-ext-source/source.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "dist/*" \
            -x "*.zip" \
            -x "web-ext-source/*"

      - name: Submit to Firefox Add-ons (AMO)
        if: ${{ steps.amo-secrets.outputs.available == 'true' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm exec web-ext sign \
            --source-dir firefox-ext \
            --channel=listed \
            --amo-metadata amo-metadata.json \
            --upload-source-code web-ext-source/source.zip \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chatgpt-markdown-exporter-*-chrome.zip
            chatgpt-markdown-exporter-*-firefox.zip
          generate_release_notes: true
