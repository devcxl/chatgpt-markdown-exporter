version: 2
updates:
  # 依赖：package.json + pnpm-lock.yaml（Dependabot 的 npm 生态同时支持 pnpm）
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # 非破坏性更新合并成一个 PR，major 仍逐个单开，便于单独评审
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  # 依赖：.github/workflows 中使用的 GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
